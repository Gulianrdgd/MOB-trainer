# Voorbeeld voor een Traefik-opstelling. Vervang de placeholders:
#   mob.example.com  jouw domein
#   websecure        de entrypoint voor HTTPS in je Traefik-config
#   letsencrypt      de naam van je certresolver
#   traefik          het Docker-netwerk waar Traefik op zit
services:
  mob-trainer:
    build: .
    image: mob-trainer:latest
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.mob-trainer.rule=Host(`mob.example.com`)
      - traefik.http.routers.mob-trainer.entrypoints=websecure
      - traefik.http.routers.mob-trainer.tls.certresolver=letsencrypt
      - traefik.http.services.mob-trainer.loadbalancer.server.port=80

networks:
  traefik:
    external: true
